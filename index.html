 <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK SPORT - Calisthenics & Fitness</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0b0b;
            color: white;
            text-align: center;
        }

        /* خلفية الهيدر باستخدام صورة الكوتش بشكل احترافي */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75)), url('akram.jpg.jpg') no-repeat center center/cover;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: inset 0 -50px 50px #0b0b0b;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            text-transform: uppercase;
        }

        .hero p {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 25px;
            max-width: 500px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .btn-main {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 5px 20px rgba(0, 123, 255, 0.4);
            transition: transform 0.2s;
        }

        .btn-main:active {
            transform: scale(0.96);
        }

        .container {
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-transform: uppercase;
            border-bottom: 2px solid #007bff;
            display: inline-block;
            padding-bottom: 5px;
        }

        .btn-option {
            display: block;
            width: 100%;
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333;
            padding: 16px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- قسم الهيدر الرئيسي مع خلفية الصورة -->
    <header class="hero">
        <h1>BUILD YOUR POWER</h1>
        <p>Entraînez-vous avec le Coach Akram & atteignez vos objectifs physiquement et mentalement.</p>
        <a href="#services" class="btn-main">Commencer maintenant</a>
    </header>

    <!-- باقي الأقسام والاختيارات -->
    <main class="container" id="services">
        <h2 class="section-title">NOS PROGRAMMES</h2>
        
        <a href="#programmes" class="btn-option">💪 Programmes d'entraînement</a>
        <a href="#nutrition" class="btn-option">🥗 Plan Nutritionnel</a>
        <a href="#contact" class="btn-option" style="background: #25d366; color: white; border: none;">💬 Contacter sur WhatsApp</a>
    </main>

</body>
</html>
